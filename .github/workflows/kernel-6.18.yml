name: kernel-6.18-hi3798mv300

# Forward-port of the HiSTBLinux V100R005 BSP to Linux 6.18 LTS, stage 1:
# boot the Hi3798M V300 to a userspace shell.
#
# Nothing here is built on a developer machine -- CI is the only build path,
# so this workflow is the single source of truth for "does it compile".
# The 1.7 GiB kernel tree is fetched and cached here rather than committed;
# the repository stores only porting/overlay, i.e. the delta we actually own.

on:
  push:
    branches: [test, master]
    paths-ignore:
      # Documentation and repo housekeeping do not change what CI builds, and
      # a full build here costs ~22 minutes.
      #
      # Deliberately NOT ignoring porting/** -- porting/overlay/ (device trees)
      # and porting/config/ (kernel config fragment) are build inputs. Broad
      # path filters that swallow them would let a real code change land
      # without ever being compiled, which defeats the entire point of making
      # CI the only build path.
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version to build against"
        required: false
        default: "6.18.57"

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.18.57' }}
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  # 32-bit compat toolchain. CONFIG_COMPAT_VDSO's Kconfig dependency is the
  # string test "$(CROSS_COMPILE_COMPAT)" != "" (arch/arm64/Kconfig:1828), so
  # exporting this variable is what lets the option stay on -- the fragment
  # line alone does not do it, and a bogus non-empty value would satisfy
  # Kconfig and only fail later in the build.
  CROSS_COMPILE_COMPAT: arm-linux-gnueabihf-
  # Make Kconfig report symbols in the fragment that do not exist, rather than
  # dropping them in silence. This is the class of the CONFIG_PSCI_FW typo that
  # shipped once already. Note this alone only warns; the actual gate is the
  # "Verify config fragment survived" step.
  KCONFIG_WARN_UNKNOWN_SYMBOLS: "1"

jobs:
  build:
    name: build Image + DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # file is required, not optional: make-initramfs.sh and this workflow
          # both call it, and the workflow's copy is UNGUARDED -- a missing
          # `file` would abort the step with 127.
          #
          # busybox-static is deliberately NOT installed any more. It was how
          # the x86-64 busybox got into an arm64 initramfs; the workflow now
          # cross-builds busybox from source, and leaving a host busybox on
          # PATH only invites the same mistake back.
          # libc6-dev-arm64-cross is NOT optional and NOT pulled in
          # automatically: gcc-aarch64-linux-gnu only *Recommends* it, and the
          # --no-install-recommends below therefore skips it. The kernel does
          # not care (it is freestanding), but busybox is a userspace program:
          # without the aarch64 libc headers, GCC's #include_next <limits.h>
          # falls through to the host's /usr/include and dies on
          # "bits/libc-header-start.h: No such file or directory".
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            bc bison flex \
            libssl-dev libelf-dev \
            device-tree-compiler \
            cpio xz-utils \
            file \
            u-boot-tools \
            rsync

      - name: Verify every tool this workflow relies on
        run: |
          set -euo pipefail
          # The busybox step failed on a CI round-trip because a build-system
          # assumption (make olddefconfig) was copied from the kernel and never
          # executed. This step exists so the cheap class of that mistake --
          # a tool or target that simply is not there -- fails in seconds with
          # a clear message instead of 23 minutes in.
          missing=0
          for t in dtc cpio gzip file od stat awk sed grep sha256sum mkimage \
                   readelf aarch64-linux-gnu-readelf aarch64-linux-gnu-gcc \
                   arm-linux-gnueabihf-gcc bison flex bc rsync curl tar; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  ok   %s\n' "$t"
            else
              printf '::error::required tool missing: %s\n' "$t"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Tool presence is not enough -- the cross toolchains also need their
          # target libc headers, which is a separate package and a separate way
          # to fail 20 minutes into a run.
          for h in /usr/aarch64-linux-gnu/include/limits.h \
                   /usr/aarch64-linux-gnu/include/stdio.h \
                   /usr/arm-linux-gnueabihf/include/limits.h; do
            if [ -r "$h" ]; then
              printf '  ok   %s\n' "$h"
            else
              printf '::error::cross libc header missing: %s (install libc6-dev-*-cross)\n' "$h"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Show toolchain
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabihf-gcc --version | head -1
          # Linux 6.18 requires GCC 8.1+; fail loudly rather than cryptically.
          gcc_major=$(aarch64-linux-gnu-gcc -dumpversion | cut -d. -f1)
          if [ "$gcc_major" -lt 8 ]; then
            echo "::error::aarch64 gcc $gcc_major is too old for Linux ${KERNEL_VERSION}"
            exit 1
          fi

      - name: Cache kernel tarball
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/kernel-dl
          key: kernel-tarball-${{ env.KERNEL_VERSION }}

      - name: Fetch Linux ${{ env.KERNEL_VERSION }}
        run: |
          set -euo pipefail
          ver="$KERNEL_VERSION"
          major="${ver%%.*}"
          tarball="linux-${ver}.tar.xz"
          mkdir -p ~/kernel-dl
          cd ~/kernel-dl

          if [ ! -f "$tarball" ]; then
            url="https://cdn.kernel.org/pub/linux/kernel/v${major}.x/${tarball}"
            echo "downloading $url"
            curl -fSL --retry 3 -o "$tarball" "$url"
          else
            echo "using cached tarball"
          fi

          # Verify against the published sums for this release line.
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v${major}.x/sha256sums.asc" \
            | grep " ${tarball}\$" > expected.sha256
          sha256sum -c expected.sha256
          echo "sha256 OK"

      - name: Extract kernel
        run: |
          set -euo pipefail
          tar -xf ~/kernel-dl/linux-${KERNEL_VERSION}.tar.xz
          mv linux-${KERNEL_VERSION} kernel-tree
          echo "KERNEL_TREE=$PWD/kernel-tree" >> "$GITHUB_ENV"

      - name: Apply Hi3798M V300 overlay
        run: bash porting/scripts/apply-overlay.sh "$KERNEL_TREE"

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "$KERNEL_TREE"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE defconfig
          # -O . is load-bearing, not cosmetic. merge_config.sh derives its
          # output path from it (see its OUTPUT/KCONFIG_CONFIG handling); with
          # `-O build` it would write build/.config, and the plain `make
          # olddefconfig` below -- which has no O= -- would re-read the
          # unmerged ./.config and silently discard this entire fragment.
          ./scripts/kconfig/merge_config.sh -m -O . \
            .config "$GITHUB_WORKSPACE/porting/config/hi3798mv300.config"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE olddefconfig

      - name: Verify config fragment survived
        run: |
          set -euo pipefail
          cd "$KERNEL_TREE"

          # Why this asserts instead of printing.
          #
          # This step used to grep the interesting symbols and display them.
          # That could never catch the failure it existed for: Kconfig rewrites
          # a dropped symbol as "# CONFIG_X is not set", which contains no "=",
          # so a dropped symbol printed nothing at all -- and the step exited 0
          # because the other alternatives still matched. An earlier revision
          # shipped CONFIG_VT=n under a "keep the image small" comment; the
          # real .config had CONFIG_VT=y and nobody noticed.
          #
          # Two holes make this assertion the only closure:
          #   - `merge_config.sh -m` exits before its own "Value requested for
          #     X not in final .config" loop, so it never checks the outcome.
          #   - `olddefconfig` then silently restores Kconfig defaults for any
          #     symbol it could not honour.
          #
          # The list of symbols to check is DERIVED from the fragment, not
          # hand-maintained. PART 1 of the fragment (every CONFIG_*=y line
          # before the "PART 2" banner) is read straight out of the file, so
          # adding a line there automatically adds it here -- a "keep these in
          # sync" comment would rot, and the failure mode of a stale list is
          # precisely the silent drop this step exists to prevent.
          fragment="$GITHUB_WORKSPACE/porting/config/hi3798mv300.config"
          from_fragment=$(awk '
            /PART 2 -- documentation only/ { exit }
            /^CONFIG_[A-Z0-9_]+=y$/ { sub(/^CONFIG_/, ""); sub(/=y$/, ""); print }
          ' "$fragment")

          if [ -z "$from_fragment" ]; then
            echo "::error::could not parse PART 1 out of $fragment -- banner changed?"
            exit 1
          fi

          # PART 2 symbols are promptless, so the fragment cannot set them and
          # they are asserted separately. They are still load-bearing for stage
          # 1, so a change in an upstream default or in what `config ARM64`
          # selects should fail here rather than surprise us at boot.
          promptless="ARM64 SMP ARM_GIC ARM_ARCH_TIMER ARM_PSCI_FW
                      PROC_FS SYSFS TTY SERIAL_EARLYCON"

          required="$from_fragment $promptless"

          fail=0
          for s in $required; do
            if ! grep -qE "^CONFIG_${s}=y$" .config; then
              echo "::error::CONFIG_${s} is not =y in the final .config"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          n=$(echo $required | wc -w)
          echo "All $n required symbols present as =y"
          for s in $required; do grep -E "^CONFIG_${s}=y$" .config; done | sort

      - name: Build device trees
        run: |
          set -euo pipefail
          cd "$KERNEL_TREE"
          # Device trees first. This is also the real DTS syntax gate: the
          # sources use #include <dt-bindings/...>, so they must go through
          # the kernel's cpp+dts pipeline rather than plain dtc.
          # A DTS error surfaces here in seconds instead of after the full
          # kernel build.
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE dtbs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          ls -la arch/arm64/boot/dts/hisilicon/hi3798mv300-hi3798mv3dmm.dtb

      - name: Build kernel Image
        run: |
          set -euo pipefail
          cd "$KERNEL_TREE"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE -j"$(nproc)" Image \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          ls -la arch/arm64/boot/Image

      - name: Build BL33 uImage (Image + appended DTB)
        run: |
          set -euo pipefail
          cd "$KERNEL_TREE"
          # The uImage rule itself is appended to arch/arm64/boot/Makefile by
          # porting/appends/. Mainline arm64 has no such target; the vendor
          # loader needs one, with IH_ARCH_ARM64 and an FDT immediately after
          # the payload, or it silently takes the 32-bit path.
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE uImage \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          ls -la arch/arm64/boot/uImage

          img=arch/arm64/boot/uImage

          # 1. The header must claim arm64, or load_fip.c never enters EL1.
          mkimage -l "$img" | tee /tmp/uimage.txt
          grep -qE 'Architecture:[[:space:]]+AArch64' /tmp/uimage.txt || {
            echo "::error::uImage is not AArch64 -- the loader would use the 32-bit path"; exit 1; }

          # 2. The payload size mkimage recorded; the DTB must start right after.
          #    uImage header is 64 bytes; ih_size is a big-endian u32 at offset
          #    12. This mirrors image_get_image_end() in the loader exactly
          #    (hdr + sizeof(image_header_t) + ih_size).
          #    Deliberately a one-liner: a heredoc's terminator would have to sit
          #    at column 1, which terminates this YAML block scalar.
          ih_size=$(python3 -c "import struct,sys; print(struct.unpack('>I', open(sys.argv[1],'rb').read(16)[12:16])[0])" "$img")
          off=$((64 + ih_size))
          echo "ih_size=$ih_size  DTB expected at offset $off"

          # 3. fdt_check_header's equivalent: the DTB magic must be exactly there.
          magic=$(od -An -tx1 -j"$off" -N4 "$img" | tr -d ' \n')
          [ "$magic" = "d00dfeed" ] || {
            echo "::error::no FDT at the end of the uImage payload (found $magic)"; exit 1; }

          # 4. And it must be a DTB, not just four plausible bytes.
          tail -c +$((off + 1)) "$img" > /tmp/appended.dtb
          dtc -I dtb -O dts -o /tmp/appended.dts /tmp/appended.dtb 2>/dev/null
          grep -q 'hi3798mv300' /tmp/appended.dts || {
            echo "::error::appended FDT is not the hi3798mv300 board tree"; exit 1; }
          echo "uImage OK: AArch64, ${ih_size} B payload, valid FDT appended"

      - name: Build aarch64 busybox for the initramfs
        run: |
          set -euo pipefail
          # The initramfs must contain TARGET binaries. An earlier revision
          # passed the runner's /bin/busybox -- an x86-64 binary -- into an
          # arm64 image, so /init could never exec and the boot would panic
          # with "No working init found" while CI stayed green. Cross-build it
          # with the same toolchain as the kernel instead of trusting a host
          # binary, and let make-initramfs.sh assert the result.
          ver=1.36.1
          url="https://busybox.net/downloads/busybox-${ver}.tar.bz2"
          curl -fSL --retry 3 -o busybox.tar.bz2 "$url"
          # Published alongside the tarball at
          # https://busybox.net/downloads/busybox-1.36.1.tar.bz2.sha256
          # This catches a truncated or substituted download. It is NOT a
          # supply-chain guarantee: the digest and the tarball come from the
          # same origin over the same TLS connection, and there is no GPG
          # signature check. Same caveat applies to the kernel tarball below.
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  busybox.tar.bz2" \
            | sha256sum -c -
          tar -xf busybox.tar.bz2
          cd "busybox-${ver}"
          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE defconfig >/dev/null
          # Static, so the initramfs needs no libc.
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # busybox 1.36.1's `tc` applet still references CBQ constants that
          # modern kernel uapi headers deleted -- TCA_CBQ_MAX, struct
          # tc_cbq_lssopt, TCF_CBQ_LSS_BOUNDED and friends -- so it cannot
          # compile against kernel 6.x headers at all:
          #   networking/tc.c:236: error: 'TCA_CBQ_MAX' undeclared
          # A bring-up initramfs needs a shell and a few coreutils, not traffic
          # control, so drop the applet rather than chase newer headers.
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          grep -q '^CONFIG_STATIC=y' .config || {
            echo "::error::could not enable CONFIG_STATIC in busybox"; exit 1; }
          grep -q '^# CONFIG_TC is not set' .config || {
            echo "::error::could not disable CONFIG_TC in busybox"; exit 1; }
          # Do NOT run `make olddefconfig` here. BusyBox ships a stripped-down
          # kconfig that has `oldconfig` but no `olddefconfig` target; an
          # earlier revision copied the kernel idiom and died with
          # "No rule to make target 'olddefconfig'". CONFIG_STATIC has no
          # dependencies, so the sed above is sufficient and busybox reads
          # .config directly.
          #
          # Output is deliberately NOT redirected: swallowing it is what made
          # that failure take a full 23-minute CI cycle to diagnose.
          make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE -j"$(nproc)"
          # A build that "succeeds" without producing the binary would sail
          # straight into the next step.
          [ -x busybox ] || { echo "::error::busybox was not produced"; exit 1; }
          file busybox
          # Fail here rather than at boot.
          ${CROSS_COMPILE}readelf -h busybox | grep -q AArch64 || {
            echo "::error::busybox is not AArch64"; exit 1; }
          cp busybox "$GITHUB_WORKSPACE/busybox-aarch64"

      - name: Build initramfs
        run: |
          set -euo pipefail
          bash porting/scripts/make-initramfs.sh \
            "$GITHUB_WORKSPACE/initramfs.cpio.gz" \
            "$GITHUB_WORKSPACE/busybox-aarch64"
          ls -la "$GITHUB_WORKSPACE/initramfs.cpio.gz"

      - name: Deploy-ready bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$KERNEL_TREE/arch/arm64/boot/Image" dist/Image
          cp "$KERNEL_TREE/arch/arm64/boot/uImage" dist/uImage
          cp "$KERNEL_TREE/arch/arm64/boot/dts/hisilicon/hi3798mv300-hi3798mv3dmm.dtb" \
             dist/hi3798mv300-hi3798mv3dmm.dtb
          cp initramfs.cpio.gz dist/
          cp "$KERNEL_TREE/.config" dist/kernel.config
          cp busybox-aarch64 dist/busybox-aarch64
          # Hash everything that is uploaded. The list used to cover only three
          # of five files, so kernel.config could change unnoticed even though
          # it is the artifact the reproducibility comparison relies on.
          ( cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort | xargs sha256sum > SHA256SUMS )
          ls -la dist/
          cat dist/SHA256SUMS

      - name: Verify artifact contents
        run: |
          set -euo pipefail
          # Everything before this point only proved the files EXIST. `ls -la`
          # and if-no-files-found cannot tell a 0-byte DTB from a good one, and
          # none of them look inside. This step is what makes "green" mean
          # something: it is the check that would have caught the x86-64
          # busybox whose absence from the pipeline let a broken initramfs ship.
          cd dist

          echo "--- Image ---"
          # arm64 boot header: magic 'ARMd' at offset 56.
          magic=$(od -An -tx1 -j56 -N4 Image | tr -d ' \n')
          [ "$magic" = "41524d64" ] || { echo "::error::Image magic is $magic, expected 41524d64 (ARMd)"; exit 1; }
          size=$(stat -c%s Image)
          [ "$size" -gt 8000000 ] || { echo "::error::Image is only $size bytes"; exit 1; }
          echo "  magic ARMd OK, $size bytes"

          echo "--- Device tree ---"
          dtc -I dtb -O dts -o /tmp/board.dts hi3798mv300-hi3798mv3dmm.dtb 2>/dev/null
          grep -q 'hisilicon,hi3798mv300' /tmp/board.dts || { echo "::error::DTB compatible missing"; exit 1; }
          grep -q 'hi3798mv3dmm'           /tmp/board.dts || { echo "::error::DTB model missing"; exit 1; }
          grep -q 'arm,pl011'              /tmp/board.dts || { echo "::error::DTB has no PL011 console"; exit 1; }
          grep -q 'console=ttyAMA0'        /tmp/board.dts || { echo "::error::DTB bootargs lost the console"; exit 1; }
          grep -q 'memory@0'               /tmp/board.dts || { echo "::error::DTB has no memory node"; exit 1; }
          # The dtsi leaves every UART disabled; the board file must enable one,
          # or there is no console and therefore no shell.
          awk '/serial@8b00000/,/};/' /tmp/board.dts | grep -q 'status = "okay"' || {
            echo "::error::uart0 is not enabled in the DTB -- no console"; exit 1; }
          echo "  compatible, model, pl011, bootargs, memory, uart0 okay"

          echo "--- BL33 uImage ---"
          # Re-checked here, in the uploaded artifact rather than the build
          # tree, because a copy step is exactly where this could be swapped
          # for the wrong file.
          mkimage -l uImage > /tmp/uimage2.txt
          grep -qE 'Architecture:[[:space:]]+AArch64' /tmp/uimage2.txt || {
            echo "::error::artifact uImage is not AArch64"; exit 1; }
          ih_size=$(python3 -c "import struct; print(struct.unpack('>I', open('uImage','rb').read(16)[12:16])[0])")
          off=$((64 + ih_size))
          magic=$(od -An -tx1 -j"$off" -N4 uImage | tr -d ' \n')
          [ "$magic" = "d00dfeed" ] || {
            echo "::error::artifact uImage has no appended FDT (found $magic at $off)"; exit 1; }
          tail -c +$((off + 1)) uImage > /tmp/app2.dtb
          dtc -I dtb -O dts -o /tmp/app2.dts /tmp/app2.dtb 2>/dev/null
          grep -q 'hisilicon,hi3798mv300' /tmp/app2.dts || {
            echo "::error::artifact uImage has the wrong FDT appended"; exit 1; }
          echo "  AArch64, $ih_size B payload, hi3798mv300 FDT appended at $off"

          echo "--- busybox + initramfs ---"
          ${CROSS_COMPILE}readelf -h busybox-aarch64 | grep -q AArch64 || {
            echo "::error::busybox-aarch64 is not AArch64"; exit 1; }
          # And the one that actually matters: what is INSIDE the initramfs.
          rm -rf /tmp/ir && mkdir /tmp/ir
          ( cd /tmp/ir && gzip -dc "$GITHUB_WORKSPACE/dist/initramfs.cpio.gz" | cpio -idm --quiet )
          [ -x /tmp/ir/init ] || { echo "::error::initramfs has no executable /init"; exit 1; }
          ${CROSS_COMPILE}readelf -h /tmp/ir/bin/busybox | grep -q AArch64 || {
            echo "::error::initramfs busybox is not AArch64 -- this would panic at boot"; exit 1; }
          echo "  initramfs /init present, busybox AArch64"

          echo "--- config ---"
          for s in ARCH_HISI SERIAL_AMBA_PL011 SERIAL_AMBA_PL011_CONSOLE COMPAT ARM_PSCI_FW; do
            grep -qE "^CONFIG_${s}=y$" kernel.config || { echo "::error::kernel.config lost CONFIG_${s}"; exit 1; }
          done
          echo "  load-bearing symbols present"

          echo "--- checksums ---"
          sha256sum -c SHA256SUMS
          echo "all artifact content checks passed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv300-kernel-${{ env.KERNEL_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.KERNEL_VERSION }}
          # This used to upload only kernel-tree/.config -- no log at all --
          # and with if-no-files-found: ignore it was a silent no-op for any
          # failure before "Extract kernel" (download, sha256, toolchain,
          # cache). The build steps now tee into build.log, so this actually
          # carries diagnostics.
          path: |
            build.log
            kernel-tree/.config
            kernel-tree/arch/arm64/boot/dts/hisilicon/Makefile
          if-no-files-found: warn
          retention-days: 7
